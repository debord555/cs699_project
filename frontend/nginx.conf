server {
    listen 80;

    # The built React app
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container. There is no trailing slash after
    # the address, so the path is passed on unchanged (/api/get_news stays /api/get_news).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is a file of the app; unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
