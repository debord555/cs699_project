services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"     
    volumes:
      - pgdata:/var/lib/postgresql/data  
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  scraper:
    build: ./scraper
    command: ["sh", "-c", "python load_sources.py && python run.py"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      DB_HOST: db 
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  nginx:
    build: ./frontend                   # builds the React app and serves it with nginx
    ports:
      - "127.0.0.1:8080:80"             # open http://localhost:8080
    depends_on:
      - backend
  llm:
    build: ./llm
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  categorize:
    build: ./llm                        # same image as llm, different worker
    command: ["python", "categorize.py"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hf-cache:/root/.cache/huggingface   # keep the downloaded model between restarts
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  geocoding:
    build: ./geocoding
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  hf-cache:
